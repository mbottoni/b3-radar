name: weekly

# Monday 14:00 UTC (11:00 in Brasília, which has no daylight saving): the
# shortlist uses Friday's close, prepared by Saturday's daily run. GitHub
# starts scheduled runs late under load, sometimes by hours.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write    # job-alert: open, comment on and close the failure issue
  actions: read    # job-alert: name the step that failed

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Test
        run: uv run pytest -q

      # Without these three secrets the email is a dry run (see the artifact).
      - name: Shortlist, track record and email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: uv run python -m b3radar weekly

      - name: Keep the rendered email
        uses: actions/upload-artifact@v7
        with:
          name: email
          path: out/
          retention-days: 30

      - name: Commit the list and the track record
        run: |
          git add data
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "picks: list of $(jq -r .asof data/status.json)"
          git push || { git pull --rebase && git push; }

      # Last: open or update the "<workflow> job failing" issue, or close it once a run succeeds.
      - name: Report the failure in an issue
        if: failure()
        uses: ./.github/actions/job-alert
        with:
          outcome: failure

      - name: Close the failure issue
        if: success()
        uses: ./.github/actions/job-alert
        with:
          outcome: success
