name: backtest

# Monthly: the yearly lists only change in May, but prices, dividends and
# corrections keep moving the results. Second day of the month, 12:17 UTC
# (09:17 in Brasília; GitHub starts it hours later).
on:
  schedule:
    - cron: "17 12 2 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write    # job-alert: open, comment on and close the failure issue
  actions: read    # job-alert: name the step that failed

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Backtest (point in time, from the committed data)
        run: uv run python -m b3radar backtest
      - name: Company pages (quarterly history since 2011)
        run: uv run python -m b3radar companies
      - name: Market valuation against the CDI (monthly since 2011)
        run: uv run python -m b3radar market

      - name: Commit the results
        run: |
          git add data/backtest data/companies data/market
          if git diff --staged --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "backtest: through $(jq -r .last data/backtest/meta.json)"
          git push || { git pull --rebase && git push; }

      # Last: open or update the "<workflow> job failing" issue, or close it once a run succeeds.
      - name: Report the failure in an issue
        if: failure()
        uses: ./.github/actions/job-alert
        with:
          outcome: failure

      - name: Close the failure issue
        if: success()
        uses: ./.github/actions/job-alert
        with:
          outcome: success
