name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q
      # The committed data must still produce a screen with the current code.
      - name: Rebuild the screen from data/
        run: uv run python -m b3radar screen && git diff --stat
